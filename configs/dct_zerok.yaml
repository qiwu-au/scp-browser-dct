# DCT browser, zero-K cells. Generated by Claude Code.
# Data folder built by the data build script of the zero-K cells.
# Shown by the DCT browser as the condition "Zero-K" (configs/dct.yaml).
title: "Single-cell proteomics browser: mouse DCT cells, zero-K diet"
short_title: "SCP browser: DCT cells, zero-K"
page_icon: "🔬"
dataset_label: "DCT cells, zero-K diet (SCP-MS)"
data_dir: data/dct_zerok
about: dct_about.md
download_prefix: DCT_zeroK
default_label_set: cell_type
default_protein: Slc12a3
min_proteins_per_cell: 100
intro: >-
  Single-cell proteomics (SCP-MS) of distal convoluted tubule (DCT) cells sorted from parvalbumin-eGFP
  mice after 4 days on a zero-potassium (zero-K) diet (one pool of three mice). Choose cell types in the
  sidebar; the pages on the left show protein detection by cell type, single proteins, the UMAP, marker
  dotplots, per-cell QC and downloads.

label_sets:
  cell_type:
    name: "Cell types (cluster annotation)"
    description: >-
      Leiden 1.0 clusters of the zero-K cells, each named from its differential proteins and the DCT
      marker list (same rule as for the control cells). No cluster was annotated as DCT2. Cells of
      clusters without marker support are 'DCT, subtype not resolved'.
    full_names:
      DCT1: "Distal convoluted tubule, DCT1"
      "DCT, subtype not resolved": "Cells of clusters without a DCT1 or DCT2 marker among their differential proteins"
  cell_type_prolif:
    name: "Cell types with ProLIF cells"
    description: >-
      The cluster annotation, with the cells of the per-cell proliferation test shown as ProLIF.
    full_names:
      DCT1: "Distal convoluted tubule, DCT1"
      ProLIF: "Proliferative NCC-positive DCT cells (per-cell proliferation test)"
      "DCT, subtype not resolved": "Cells of clusters without a DCT1 or DCT2 marker among their differential proteins"
  cell_type_transferred:
    name: "Label transferred from control cells"
    description: >-
      Each zero-K cell takes the most frequent cluster annotation of its ten nearest control cells.
    full_names:
      DCT1: "Distal convoluted tubule, DCT1"
      DCT2: "Distal convoluted tubule, DCT2"
      "DCT, subtype not resolved": "The most frequent annotation of the ten nearest control cells is 'DCT, subtype not resolved'"

crosstab:
  - [cell_type, cell_type_prolif]
  - [cell_type, cell_type_transferred]

cluster_table:
  title: "Clusters and their marker evidence"
  label_set: cell_type
  help: >-
    One row per Leiden 1.0 cluster of the zero-K cells. Differential proteins: each cluster against all
    other cells. A cluster is named after the cell type whose markers (DCT marker list, Supplementary
    Table S2) are among its top 25 differential proteins. Slc12a3 and Umod count as shared markers.
    Evidence: 'high' = at least one type-specific marker and marker enrichment q < 0.05; 'medium' = a
    type-specific marker, q ≥ 0.05; 'low_shared_only' = shared markers only. Clusters without a marker in
    the top 25 are rescued when a type-specific marker is significantly up at any rank
    ('specific_any_rank'; markers with rank, AUC, q and detection are listed); otherwise their cells are
    'DCT, subtype not resolved' ('unknown_no_marker_in_top_de'). ProLIF cells: cells of the cluster that
    the per-cell proliferation test calls ProLIF; that test is separate from the cluster annotation.
  columns:
    cluster: "Cluster"
    n_cells: "Cells"
    cell_type: "Cell type"
    cluster_evidence: "Evidence"
    top25_label: "Cell type from top-25 DE proteins"
    top25_confidence: "Top-25 evidence"
    top25_overlap: "Markers in top 25"
    rescued: "Rescued"
    rescue_markers: "Rescue markers (rank; AUC; q; detected in cluster vs rest)"
    median_protein_ids: "Median proteins per cell"
    n_prolif_cells: "ProLIF cells (per-cell test)"

# Extra per-cell columns shown in the Cells & UMAP table.
cell_extra_columns: [sort_plate, well, cluster, cluster_evidence, prolif, cycling, proliferation_score, proliferation_q,
                     transfer_vote_fraction]

default_dotplot_list: "Slc12a3, Pvalb, Egf, Calb1, Slc8a1, S100g, Umod, Slc12a1, Mki67, Top2a"

texts:
  marker_column: "Marker for (DCT marker list)"
  marker_help: "rows of the DCT marker list (Supplementary Table S2) that list the protein"
  dotplot_presets_help: >-
    the columns of the manuscript's DCT marker dotplot in its marker groups (core DCT, DCT1, DCT2, TAL,
    cycling; these are marker groups, not cell labels), and every quantified marker of the DCT marker
    list, each under the first cell type that lists it
  marker_list_name: "DCT marker list"

qc_metrics:
  n_proteins: "Proteins per cell"
  dynamic_range_log10: "Dynamic range (log10)"
  total_intensity: "Total intensity"
  mitocarta_intensity_fraction: "MitoCarta3.0 intensity fraction"
qc_log_metrics: [total_intensity]
