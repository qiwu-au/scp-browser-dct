# DCT browser: control and zero-K cells in one app, with a comparison page. Generated by Claude Code.
# Each condition has its own dataset config and data folder; the comparison data are built by
# the comparison build script of the browser data.
title: "Single-cell proteomics browser: mouse DCT cells, control and zero-K diet"
short_title: "SCP browser: mouse DCT cells"
page_icon: "🔬"
about: dct_about.md

condition_label: "Condition"
condition_help: >-
  Every page except 'Control vs zero-K' shows the cells of one condition on their own: their own UMAP,
  clusters and cell types.
conditions:
  Control: dct_control
  Zero-K: dct_zerok

comparison:
  page_title: "Control vs zero-K"
  title: "Control against zero-K diet"
  data_dir: data/dct_comparison
  suffixes: [control, zero_k]
  colors: ["#1baf7a", "#eda100"]
  download_prefix: DCT
  design_note: >-
    One pool of three mice per condition: condition and pool cannot be separated, and cells are not
    animal-level replicates. Every p and q value on this page is descriptive. P1 and P2 are sort plates of
    the pooled cells (technical).
  help: |
    This page uses the cells of **both conditions**. The sidebar *Condition* and *Cell type(s)* filters do not apply here; the *Protein ID field* and *Search term* do.

    - **Proteins compared:** the 5,897 protein groups retained in both conditions (detected in at least two retained cells of each). Both conditions come from one Spectronaut search, so a protein group is the same in both.
    - **Cell group:** the cells compared. *Cells annotated DCT1 or DCT2* uses the cluster annotation of each condition (all annotated zero-K cells are DCT1). The other groups are DCT1 alone, the cells with the subtype not resolved, and all retained cells.
    - **One protein:** cells with the protein detected and ln(1 + intensity) among detected cells, per condition; each condition on its own UMAP with one colour range.
    - **All proteins:** the same counts and summaries for every compared protein. These columns are computed by the browser and involve no test.
    - **Reported results:** for the group *Cells annotated DCT1 or DCT2*, the results of the comparison as reported in Supplementary Table S18 of the manuscript (two-part test of detection and intensity, each adjusted for the number of proteins per cell). The browser shows these stored values and runs no test of its own.
    - **Dotplot:** one row per condition and cell type. Colour uses a z-score over the cells of both conditions, so the two conditions are on one scale.
    - **Pre-specified panel:** the panel of proteins and scores fixed before the comparison.
  group_help: >-
    Cells compared in the tabs 'One protein' and 'All proteins'. Counts: control, zero-K.
  tabs: ["One protein", "All proteins", "Dotplot", "Pre-specified panel", "One condition only", "Downloads"]
  hover_label_set: cell_type
  reported_title: "Reported result for this protein"
  reported_note: >-
    Reported columns: two-part test in the cells annotated DCT1 or DCT2 (467 control, 449 zero-K);
    q: Benjamini-Hochberg over the 3,684 tested proteins; descriptive (one pool of three mice per condition).
  not_tested_note: >-
    This protein is not among the 3,684 tested proteins (tested: detected in at least 10% of the cells
    of a condition).
  no_test_note: "Counts and summaries only; no test."
  dotplot_note: >-
    Rows: the cell types of each condition, the same type of the two conditions next to each other.
    Dot size = fraction of cells with the protein detected; colour = group mean of the z-scored
    ln(1 + intensity) (z-score over the cells of both conditions), rescaled 0–1 per protein across the rows.
    The cell group chosen above does not apply here.
  panel_note: |
    Panel of proteins and scores fixed before the comparison, in the cells annotated DCT1 or DCT2 (467 control, 449 zero-K). *Expected*: direction under the zero-K diet fixed in advance. *Observed*: direction when q < 0.05 (Benjamini-Hochberg within the 28 panel items). The panel was fixed before any test between the conditions, but after the detection frequency of its proteins in each condition had been tabulated.
  one_condition_note: |
    Protein groups retained (detected in at least two retained cells) in one condition only: 181 in control only, 56 in zero-K only. They are not compared, and their presence in one condition is not read as an effect of the diet.
  downloads_note: |
    Files of this page. The data dictionary defines every column. The comparison table of the chosen cell group, the dotplot values, the panel and the one-condition list can be downloaded in their tabs.
  row_sets:
    - name: "Cluster annotation"
      label_sets: [cell_type, cell_type]
    - name: "Cluster annotation with ProLIF cells"
      label_sets: [cell_type_prolif, cell_type_prolif]
    - name: "Control: cluster annotation; zero-K: label transferred from control cells"
      label_sets: [cell_type, cell_type_transferred]
  reported_columns: [observed_direction, q_two_part, int_log2fc_adjusted, pseudobulk_log2fc_P1, pseudobulk_log2fc_P2]
  panel_columns: [item, item_type, expected_direction, observed_direction, match_status, q_primary, det_control,
                  det_zero_k, detection_fraction_control, detection_fraction_zero_k, int_log2fc_adjusted,
                  pseudobulk_log2fc_P1, pseudobulk_log2fc_P2, score_coef]
  column_names:
    protein: "Protein (analysis name)"
    gene_symbol: "Gene symbol"
    protein_group: "UniProt accession"
    description: "Protein description"
    n_control: "Cells, control"
    n_zero_k: "Cells, zero-K"
    det_control: "Detected, control"
    det_zero_k: "Detected, zero-K"
    detection_fraction_control: "Detection, control"
    detection_fraction_zero_k: "Detection, zero-K"
    detection_difference_zero_k_minus_control: "Detection, zero-K − control"
    median_ln_control: "Median ln(1+intensity), detected, control"
    median_ln_zero_k: "Median ln(1+intensity), detected, zero-K"
    log2fc_detected: "log2 FC among detected cells (no adjustment)"
    observed_direction: "Reported: direction (q < 0.05)"
    q_two_part: "Reported: q (two-part test)"
    q_primary: "Reported: q (within the panel)"
    int_log2fc_adjusted: "Reported: log2 FC among detected cells, adjusted"
    pseudobulk_log2fc_P1: "Reported: log2 ratio of mean intensity, sort plate P1"
    pseudobulk_log2fc_P2: "Reported: log2 ratio of mean intensity, sort plate P2"
    item: "Item"
    item_type: "Type"
    expected_direction: "Expected"
    match_status: "Match"
    score_coef: "Reported: score coefficient"
